name: Linters and coding standards checks

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install pinned clang-format
        run: python -m pip install -r .github/lint-requirements.txt
      - name: Check pre-commit clang-format version matches the pinned version
        run: |
          pinned=$(sed -n 's/^clang-format==//p' .github/lint-requirements.txt)
          hook=$(grep -A1 'mirrors-clang-format' .pre-commit-config.yaml | sed -n 's/^ *rev: v//p')
          if [ "$pinned" != "$hook" ]; then
            echo "::error::clang-format is $pinned in .github/lint-requirements.txt but $hook in .pre-commit-config.yaml; keep them in sync."
            exit 1
          fi
      - name: Run clang-format style check for C/C++
        run: |
          clang-format --version
          git ls-files 'src/*.c' 'src/*.cc' 'src/*.cpp' 'src/*.h' 'src/*.hh' 'src/*.hpp' 'src/*.imp' \
            | xargs clang-format --dry-run --Werror

  clang-tidy:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y automake autoconf libwxgtk3.2-dev
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install pinned clang-tidy
        run: python -m pip install -r .github/lint-requirements.txt
      - run: aclocal
      - run: automake --add-missing
      - run: autoconf
      - run: ./configure
      - run: make clang-tidy CLANG_TIDY_JOBS=$(nproc)

  ruff:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0

  cython-lint:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Python packages
        run: python -m pip install cython-lint
      - name: cython-lint
        run: cython-lint .

  mypy:
    name: mypy --strict on pygambit's Python modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install mypy and the typed dependencies
        run: python -m pip install mypy numpy scipy scipy-stubs
      - name: mypy
        # The leaf modules import nothing compiled. Widen this to `mypy -p pygambit`
        # when pygambit.gambit has a stub.
        run: mypy src/pygambit/_[a-z]*.py

  cython-lines:
    name: Cython lines do not exceed the ceiling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Count Cython lines in pygambit
        run: python build_support/cython_lines.py --max 4767

  catalog-am-sync:
    name: catalog.am and manifest.json are up to date
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pygambit (editable, picks up catalog/games directly)
        run: |
          python -m pip install -v -e ".[doc]"
          pip install "gtdraw @ git+https://github.com/gambitproject/gtdraw.git@main"
      - name: Regenerate catalog/catalog.am and catalog/games/manifest.json
        run: python catalog/build.py --build --skip-table
      - name: Fail if catalog.am or manifest.json is out of sync with catalog/games
        run: |
          if ! git diff --exit-code -- catalog/catalog.am catalog/games/manifest.json; then
            echo "::error::catalog/catalog.am or catalog/games/manifest.json is out of sync with catalog/games. Run 'python catalog/build.py --build' and commit the result."
            exit 1
          fi
