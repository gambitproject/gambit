name: MacOS static GUI binary

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 6 * * 4'
  workflow_dispatch:

jobs:
  macos:
    name: macOS DMG (wxWidgets 3.2)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Find latest wxWidgets 3.2.x release
        run: |
            version=$(git ls-remote --tags --refs https://github.com/wxWidgets/wxWidgets 'v3.2.*' \
              | sed 's|.*refs/tags/v||' | grep -E '^3\.2\.[0-9]+$' | sort -V | tail -1)
            test -n "${version}"
            echo "Using wxWidgets ${version}"
            echo "WX_VERSION=${version}" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
            brew install automake autoconf
            curl -L -O https://github.com/wxWidgets/wxWidgets/releases/download/v${WX_VERSION}/wxWidgets-${WX_VERSION}.tar.bz2
            tar xjf wxWidgets-${WX_VERSION}.tar.bz2
            cd wxWidgets-${WX_VERSION}
            mkdir build-release
            cd build-release
            ../configure --disable-shared --disable-sys-libs
            make -j4
            sudo make install
      - run: aclocal
      - run: automake --add-missing
      - run: autoconf
      - run: ./configure
      - run: make
      - run: sudo make install
      - run: make osx-dmg
      - run: make dist
      - uses: actions/upload-artifact@v7
        with:
          name: artifact-osx
          path: "*.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: artifact-source-dist
          path: "*.tar.gz"
