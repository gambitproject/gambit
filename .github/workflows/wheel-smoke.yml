
name: pygambit wheel smoke test

on:
  push:
  pull_request:

jobs:
  windows-cp314:
    runs-on: windows-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Set up dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned to reproduce the toolchain combo in effect when v16.7.0 was tagged (2026-07-11):
          # cython 3.2.8 and cibuildwheel 4.1.0 were the latest available at that date.
          pip install cython==3.2.8 wheel lxml numpy scipy cibuildwheel==4.1.0
      - name: Build and smoke-test cp314 Windows wheel
        run: |
          python -m cibuildwheel --output-dir wheelhouse/
        env:
          CIBW_BUILD: "cp314-win_amd64"
