
name: pygambit wheels

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
        python-tag: [cp310, cp311, cp312, cp313, cp314]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Set up dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel
      - name: Build and smoke-test wheel
        run: |
          python -m cibuildwheel --output-dir wheelhouse/
        env:
          CIBW_BUILD: "${{ matrix.python-tag }}-*"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-tag }}
          path: ./wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Set up dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build sdist
        run: |
          python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: ./dist/*.tar.gz
