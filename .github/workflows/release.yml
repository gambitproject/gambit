name: Create GitHub release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog for this version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME}"
          python3 build_support/releases/extract_changelog.py "${VERSION#v}"

      - name: Determine prerelease status
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME}"
          if [[ "${VERSION#v}" =~ -(alpha|beta|rc) ]]; then
            echo "prerelease_flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          PRERELEASE_FLAG: ${{ steps.version.outputs.prerelease_flag }}
        run: |
          # shellcheck disable=SC2086  # the flag must vanish when empty
          gh release create "${REF_NAME}" \
            --title "Gambit ${REF_NAME}" \
            --notes-file release_notes.md \
            ${PRERELEASE_FLAG}
